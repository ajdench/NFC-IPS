<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC IPS Viewer</title>
    <script>
        (function() {
            const normalize = (path) => path.replace(/\/+$/, '') || '/';

            const resolveRepoBase = () => {
                const pathSegments = window.location.pathname
                    .split('/')
                    .filter(Boolean);

                if (pathSegments.length === 0) {
                    return '/NFC-IPS';
                }

                return `/${pathSegments[0]}`;
            };

            const repoBasePath = resolveRepoBase();
            const targetPath = normalize(`${repoBasePath}/nfc/ips/home.html`);

            const currentPath = normalize(window.location.pathname);
            const normalizedTarget = targetPath;

            console.info('[NFC-IPS redirect]', {
                repoBasePath,
                currentPath,
                targetPath,
                search: window.location.search,
                hash: window.location.hash
            });

            const isAtTarget = currentPath === normalizedTarget;
            const isAtRepoRoot = currentPath === normalize(repoBasePath) ||
                currentPath === normalize(`${repoBasePath}/index.html`) ||
                currentPath === '/' ||
                currentPath === '/index.html';

            if (!isAtTarget && isAtRepoRoot) {
                const redirectUrl = `${targetPath}${window.location.search}${window.location.hash}`;
                window.location.replace(redirectUrl);
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to NFC IPS Viewer...</p>
</body>
</html>
