syntax = "proto3";

package medis.nfc;

// Phase 2: System URL Compression (90% reduction)
enum SystemType {
    UNKNOWN_SYSTEM = 0;
    SNOMED_CT = 1;          // http://snomed.info/sct
    LOINC = 2;              // http://loinc.org
    UCUM = 3;               // http://unitsofmeasure.org
    HL7_CONDITION = 4;      // http://terminology.hl7.org/CodeSystem/condition-clinical
    HL7_VERIFICATION = 5;   // http://terminology.hl7.org/CodeSystem/condition-ver-status
    HL7_OBSERVATION = 6;    // http://terminology.hl7.org/CodeSystem/observation-category
    ISO_3166 = 7;           // urn:iso:std:iso:3166
    NHS_IDENTIFIER = 8;     // https://fhir.nhs.uk/Id/nhs-number
}

// Phase 2: Status Code Compression (95% reduction)
enum ClinicalStatus {
    UNKNOWN_CLINICAL = 0;
    ACTIVE = 1;             // "active"
    RESOLVED = 2;           // "resolved"
    INACTIVE = 3;           // "inactive"
    REMISSION = 4;          // "remission"
}

enum VerificationStatus {
    UNKNOWN_VERIFICATION = 0;
    CONFIRMED = 1;          // "confirmed"
    UNCONFIRMED = 2;        // "unconfirmed"
    PROVISIONAL = 3;        // "provisional"
    DIFFERENTIAL = 4;       // "differential"
}

enum ObservationCategory {
    UNKNOWN_CATEGORY = 0;
    VITAL_SIGNS = 1;        // "vital-signs"
    LABORATORY = 2;         // "laboratory"
    SURVEY = 3;            // "survey"
    SOCIAL_HISTORY = 4;    // "social-history"
}

// Enhanced CodeRef with optional enum compression
message CodeRef {
    oneof system_reference {
        string sys = 1;         // Legacy: full system URL
        SystemType system_id = 9; // Phase 2: enum compression
    }
    string code = 2;

    // Optional status compression fields
    ClinicalStatus clinical_status = 10;
    VerificationStatus verification_status = 11;
    ObservationCategory category = 12;
}

message Patient {
    string given = 1;
    string family = 2;
    CodeRef gender = 3;
    CodeRef blood_group = 4;
    CodeRef nhs_id = 5;
    CodeRef service_id = 6;
    string dob = 7;
    CodeRef rank = 8;              // Changed from string - now supports multi-coding
    string title = 9;
    CodeRef nationality = 10;      // Changed from string - now ISO 3166 coded
    string id = 11;                // Patient.id for fullUrl reconstruction
}

message Vital {
    CodeRef code = 1;
    double value = 2;
    string time = 3;
    string id = 4;                 // Observation.id for fullUrl reconstruction
    string unit = 5;               // Optional unit for vital signs
}

message Lab {
    CodeRef code = 1;
    double value = 2;
    string time = 3;
    string id = 4;                 // Observation.id for fullUrl reconstruction
    string unit = 5;               // Unit for lab results (e.g., "10*3/uL")
}

message Assessment {
    CodeRef code = 1;
    oneof value_type {
        CodeRef value_code = 2;    // CodeableConcept value (most common)
        bool value_bool = 3;       // Boolean value (e.g., febrile status)
        double value_quantity = 4; // Numeric value (if needed)
    }
    string time = 5;
    string id = 6;                 // Observation.id for fullUrl reconstruction
    CodeRef body_site = 7;         // Optional bodySite (e.g., lung location)
}

message Condition {
    CodeRef code = 1;
    string onset = 2;
    string id = 3;                 // Condition.id for fullUrl reconstruction
}

message Event {
    CodeRef code = 1;
    string time = 2;
    double dose = 3;
    string unit = 4;
    string route = 5;
    string id = 6;                 // MedicationAdministration.id or Procedure.id for fullUrl reconstruction
}

message ServiceRequest {
    CodeRef code = 1;
    string time = 2;               // ServiceRequest.authoredOn
    string priority = 3;           // "routine", "urgent", "asap", "stat"
    string id = 4;                 // ServiceRequest.id for fullUrl reconstruction
}

message Imaging {
    string id = 1;                 // ImagingStudy.id
    CodeRef modality = 2;          // Modality code (CT, X-RAY, MRI, etc.)
    string description = 3;        // ImagingStudy.description (findings)
    string time = 4;               // ImagingStudy.started
}

message Encounter {
    string id = 1;                 // Encounter.id
    string start = 2;              // Encounter.period.start
    string end = 3;                // Encounter.period.end
    CodeRef class_code = 4;        // Encounter.class (EMER, IMP, etc.)
    string type_code = 5;          // Encounter.type.coding[0].code (poi, r1_phc, r1_phec, etc.)
}

message Stage {
    repeated Vital vitals = 1;
    repeated Condition conditions = 2;
    repeated Event events = 3;
    repeated Lab labs = 4;                    // NEW: Laboratory observations
    repeated Assessment assessments = 5;      // NEW: Clinical assessments (MIST/MARCH)
    repeated ServiceRequest requests = 6;     // NEW: Service requests (CASEVAC, etc.)
    Encounter encounter = 7;                  // NEW: Encounter metadata per stage
    repeated Imaging imaging = 8;             // NEW: Imaging studies for this stage
}

message BundleMetadata {
    string id = 1;
    string meta_json = 2;
    string identifier_json = 3;
    string type = 4;
    string timestamp = 5;
}

message Allergy {
    CodeRef code = 1;
    string onset = 2;
    string severity = 3;
    string id = 4;                 // AllergyIntolerance.id for fullUrl reconstruction
    string recorded_date = 5;      // AllergyIntolerance.recordedDate (ISO string)
}

message MedicationStatement {
    CodeRef code = 1;              // MedicationStatement.medicationCodeableConcept
    string id = 2;                 // MedicationStatement.id
    string status = 3;             // "active", "completed", "stopped", etc.
}

message Organization {
    string id = 1;                 // Organization.id
    string name = 2;               // Organization.name
}

message NFCPayload {
    Patient patient = 1;
    Stage poi = 2;
    Stage medevac = 3;
    Stage r1 = 4;
    Stage r2 = 5;
    Stage casevac = 6;
    Stage r3 = 7;
    int64 t = 8;                       // Bundle.timestamp (Unix milliseconds)
    BundleMetadata bundleMetadata = 9; // DEPRECATED - will be removed
    repeated Allergy allergies = 10;

    // Lossless reconstruction metadata (v2.0)
    string bundle_id = 11;             // Bundle.id
    string bundle_identifier = 12;     // Bundle.identifier.value (UUID)
    string composition_id = 13;        // Composition.id
    string composition_title = 14;     // Composition.title
    int64 composition_date = 15;       // Composition.date (Unix milliseconds)

    // Phase 3: 100% lossless timestamps
    string bundle_meta_last_updated = 16;  // Bundle.meta.lastUpdated (ISO string)

    // Phase 4: Additional resource types
    repeated MedicationStatement medications = 17;  // NEW: Ongoing medications
    Organization organization = 18;                 // NEW: Authoring organization

    // Phase 5: Complete care stage coverage
    Stage axp = 19;
    Stage fwdTacevac = 20;
    Stage rearTacevac = 21;
    Stage stratevac = 22;
}
